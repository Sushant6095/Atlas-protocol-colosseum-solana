[package]
name = "atlas-rebalancer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Atlas Rebalancer — proof-gated allocator across Kamino, Drift, Jupiter, marginfi"

[lib]
crate-type = ["cdylib", "lib"]
name = "atlas_rebalancer"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_2022_extensions"] }
atlas-verifier = { path = "../atlas-verifier", features = ["cpi"] }
atlas-vault = { path = "../atlas-vault", features = ["cpi"] }
atlas-registry = { path = "../atlas-registry", features = ["cpi"] }
