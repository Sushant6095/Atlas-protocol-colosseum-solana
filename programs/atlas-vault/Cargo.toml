[package]
name = "atlas-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Atlas Vault — Token-2022 USDC vault with strategy commitment + share accounting"

[lib]
crate-type = ["cdylib", "lib"]
name = "atlas_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_2022_extensions"] }
