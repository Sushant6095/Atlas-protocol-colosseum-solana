[package]
name = "atlas-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Atlas Verifier — onchain Groth16 verifier wrapping sp1-solana for Solana programs"

[lib]
crate-type = ["cdylib", "lib"]
name = "atlas_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
sp1-solana = "0.1.0"
solana-program = "2.1.0"
