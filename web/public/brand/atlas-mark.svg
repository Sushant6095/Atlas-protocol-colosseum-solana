<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Atlas">
  <title>Atlas</title>
  <defs>
    <linearGradient id="atlasG" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#29d3ff"/>
    </linearGradient>
    <radialGradient id="atlasCore" cx="32" cy="32" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#29d3ff"/>
      <stop offset="1" stop-color="#29d3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#atlasG)" stroke-width="2.4" fill="none" stroke-linecap="round">
    <!-- celestial sphere -->
    <circle cx="32" cy="32" r="22"/>
    <!-- equatorial ring -->
    <ellipse cx="32" cy="32" rx="22" ry="6"/>
    <!-- meridian ring -->
    <ellipse cx="32" cy="32" rx="6" ry="22"/>
    <!-- ecliptic (tilted) -->
    <ellipse cx="32" cy="32" rx="22" ry="9" transform="rotate(28 32 32)" opacity="0.7"/>
    <!-- polar axis -->
    <line x1="32" y1="6" x2="32" y2="10" stroke-width="2.4"/>
    <line x1="32" y1="54" x2="32" y2="58" stroke-width="2.4"/>
  </g>

  <!-- core star (vault) -->
  <circle cx="32" cy="32" r="6" fill="url(#atlasCore)"/>
  <circle cx="32" cy="32" r="1.8" fill="#ffffff"/>

  <!-- pole star -->
  <circle cx="32" cy="6" r="1.6" fill="#29d3ff"/>
</svg>
