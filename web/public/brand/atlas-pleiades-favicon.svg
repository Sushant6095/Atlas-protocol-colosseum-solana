<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Atlas">
  <title>Atlas</title>

  <defs>
    <linearGradient id="favLine" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A682FF"/>
      <stop offset="1" stop-color="#3F8CFF"/>
    </linearGradient>
    <radialGradient id="favCore" cx="16" cy="19" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#3F8CFF"/>
      <stop offset="1" stop-color="#A682FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- simplified A constellation, 5 stars at favicon size -->
  <g stroke="url(#favLine)" stroke-width="1.2" stroke-linecap="round" fill="none">
    <line x1="16" y1="4"  x2="11" y2="14"/>
    <line x1="11" y1="14" x2="6"  y2="26"/>
    <line x1="16" y1="4"  x2="21" y2="14"/>
    <line x1="21" y1="14" x2="26" y2="26"/>
    <line x1="11" y1="14" x2="21" y2="14"/>
  </g>

  <circle cx="16" cy="19" r="5" fill="url(#favCore)"/>
  <circle cx="16" cy="19" r="2" fill="#FFFFFF"/>
  <circle cx="16" cy="4"  r="1.5" fill="#3F8CFF"/>
  <circle cx="11" cy="14" r="1.2" fill="#A682FF"/>
  <circle cx="21" cy="14" r="1.2" fill="#A682FF"/>
  <circle cx="6"  cy="26" r="1.2" fill="#F478C6"/>
  <circle cx="26" cy="26" r="1.2" fill="#F478C6"/>
</svg>
