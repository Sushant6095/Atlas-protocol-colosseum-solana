<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Atlas — Pleiades constellation mark (light surface)">
  <title>Atlas</title>
  <desc>Seven-star constellation in the form of a capital A. Light-surface variant — strokes are darker for contrast on white backgrounds.</desc>

  <defs>
    <linearGradient id="atlasLineL" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A2DDB"/>
      <stop offset="0.55" stop-color="#1F5DD6"/>
      <stop offset="1" stop-color="#0E50C7"/>
    </linearGradient>
    <radialGradient id="consensusGlowL" cx="32" cy="38" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E50C7" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#5A2DDB" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5A2DDB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#atlasLineL)" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="32" y1="8"  x2="22" y2="27"/>
    <line x1="22" y1="27" x2="14" y2="48"/>
    <line x1="32" y1="8"  x2="42" y2="27"/>
    <line x1="42" y1="27" x2="50" y2="48"/>
    <line x1="22" y1="27" x2="32" y2="38"/>
    <line x1="32" y1="38" x2="42" y2="27"/>
  </g>

  <circle cx="32" cy="38" r="9" fill="url(#consensusGlowL)"/>

  <circle cx="32" cy="8"  r="2.4" fill="#0E50C7"/>
  <circle cx="22" cy="27" r="1.8" fill="#5A2DDB"/>
  <circle cx="42" cy="27" r="1.8" fill="#5A2DDB"/>
  <circle cx="32" cy="38" r="3.2" fill="#0E50C7"/>
  <circle cx="32" cy="38" r="1.4" fill="#FFFFFF"/>
  <circle cx="14" cy="48" r="1.8" fill="#C72D85"/>
  <circle cx="50" cy="48" r="1.8" fill="#C72D85"/>
  <circle cx="32" cy="56" r="1.4" fill="#1B9568" opacity="0.9"/>

  <line x1="14" y1="56" x2="50" y2="56" stroke="#0E50C7" stroke-width="0.4" stroke-dasharray="0.5 1.5" opacity="0.4"/>
</svg>
