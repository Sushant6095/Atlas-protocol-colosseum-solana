<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="Atlas">
  <title>Atlas</title>
  <desc>Atlas wordmark with Pleiades constellation mark on the left and ATLAS in geometric letters on the right.</desc>

  <defs>
    <linearGradient id="markLine" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A682FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#3F8CFF"/>
    </linearGradient>
    <radialGradient id="markConsensus" cx="32" cy="38" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#3F8CFF"/>
      <stop offset="0.7" stop-color="#A682FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A682FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pleiades mark (64x64 region) -->
  <g>
    <g stroke="url(#markLine)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="32" y1="8"  x2="22" y2="27"/>
      <line x1="22" y1="27" x2="14" y2="48"/>
      <line x1="32" y1="8"  x2="42" y2="27"/>
      <line x1="42" y1="27" x2="50" y2="48"/>
      <line x1="22" y1="27" x2="32" y2="38"/>
      <line x1="32" y1="38" x2="42" y2="27"/>
    </g>
    <circle cx="32" cy="38" r="9" fill="url(#markConsensus)"/>
    <circle cx="32" cy="8"  r="2.4" fill="#3F8CFF"/>
    <circle cx="32" cy="8"  r="1.0" fill="#FFFFFF"/>
    <circle cx="22" cy="27" r="1.8" fill="#A682FF"/>
    <circle cx="22" cy="27" r="0.7" fill="#FFFFFF"/>
    <circle cx="42" cy="27" r="1.8" fill="#A682FF"/>
    <circle cx="42" cy="27" r="0.7" fill="#FFFFFF"/>
    <circle cx="32" cy="38" r="3.2" fill="#FFFFFF"/>
    <circle cx="32" cy="38" r="2.0" fill="#3F8CFF"/>
    <circle cx="32" cy="38" r="0.9" fill="#FFFFFF"/>
    <circle cx="14" cy="48" r="1.8" fill="#F478C6"/>
    <circle cx="14" cy="48" r="0.7" fill="#FFFFFF"/>
    <circle cx="50" cy="48" r="1.8" fill="#F478C6"/>
    <circle cx="50" cy="48" r="0.7" fill="#FFFFFF"/>
    <circle cx="32" cy="56" r="1.4" fill="#3CE39A" opacity="0.85"/>
    <circle cx="32" cy="56" r="0.5" fill="#FFFFFF"/>
    <line x1="14" y1="56" x2="50" y2="56" stroke="#3F8CFF" stroke-width="0.4" stroke-dasharray="0.5 1.5" opacity="0.35"/>
  </g>

  <!-- vertical divider -->
  <line x1="78" y1="14" x2="78" y2="50" stroke="#3F8CFF" stroke-width="0.6" opacity="0.35"/>

  <!-- ATLAS wordmark in geometric letters as paths (Cabinet-Grotesk-inspired) -->
  <!-- All letters share: cap height 28 (y 18 to y 46), uniform stroke 3 -->
  <g fill="#E6EAF2" font-family="'Cabinet Grotesk','General Sans','Geist',ui-sans-serif,system-ui,sans-serif" font-weight="600" font-size="32" letter-spacing="6">
    <text x="96" y="44">ATLAS</text>
  </g>

  <!-- subtle proof-pink accent under the wordmark -->
  <line x1="96" y1="50" x2="220" y2="50" stroke="#F478C6" stroke-width="0.6" opacity="0.5"/>
</svg>
