<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none" role="img" aria-label="Atlas — Titan wordmark">
  <title>Atlas</title>
  <desc>Atlas Titan mark on the left, ATLAS wordmark on the right.</desc>

  <defs>
    <linearGradient id="wmFigure" x1="32" y1="28" x2="32" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A682FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#3F8CFF"/>
    </linearGradient>
    <linearGradient id="wmSphere" x1="20" y1="6" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A682FF"/>
      <stop offset="1" stop-color="#3F8CFF"/>
    </linearGradient>
    <radialGradient id="wmCore" cx="32" cy="17" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F8CFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A682FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmStar" cx="32" cy="6" r="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#3F8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mark (kept native size for crispness) -->
  <g>
    <circle cx="32" cy="17" r="11" fill="url(#wmCore)"/>
    <circle cx="32" cy="17" r="10" stroke="url(#wmSphere)" stroke-width="1.6" fill="none"/>
    <ellipse cx="32" cy="17" rx="10" ry="3" stroke="url(#wmSphere)" stroke-width="1.0" fill="none" opacity="0.85"/>
    <ellipse cx="32" cy="17" rx="3" ry="10" stroke="url(#wmSphere)" stroke-width="1.0" fill="none" opacity="0.85"/>
    <ellipse cx="32" cy="17" rx="10" ry="4.5" transform="rotate(28 32 17)" stroke="url(#wmSphere)" stroke-width="0.8" fill="none" opacity="0.55"/>
    <circle cx="32" cy="6.5" r="3" fill="url(#wmStar)" opacity="0.9"/>
    <circle cx="32" cy="6.5" r="1.4" fill="#FFFFFF"/>

    <g stroke="url(#wmFigure)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 24.5 28 Q 21 32 22.5 36 Q 24.5 40 27 41" />
      <path d="M 39.5 28 Q 43 32 41.5 36 Q 39.5 40 37 41" />
      <path d="M 27 41 L 28 53" />
      <path d="M 37 41 L 36 53" />
      <path d="M 27 53 L 37 53" stroke-width="2.6"/>
      <path d="M 28 53 Q 22 60 18 64 Q 14 68 12 72" />
      <path d="M 36 53 Q 42 60 46 64 Q 50 68 52 72" />
    </g>

    <circle cx="32" cy="33" r="3.4" fill="url(#wmFigure)"/>
    <circle cx="24.5" cy="28" r="1.6" fill="url(#wmFigure)"/>
    <circle cx="39.5" cy="28" r="1.6" fill="url(#wmFigure)"/>
    <circle cx="12" cy="72" r="1.6" fill="url(#wmFigure)"/>
    <circle cx="52" cy="72" r="1.6" fill="url(#wmFigure)"/>
  </g>

  <!-- vertical divider -->
  <line x1="84" y1="22" x2="84" y2="62" stroke="#3F8CFF" stroke-width="0.6" opacity="0.35"/>

  <!-- ATLAS wordmark -->
  <text x="104" y="54" fill="#E6EAF2" font-family="'Cabinet Grotesk','General Sans','Geist',ui-sans-serif,system-ui,sans-serif" font-size="40" font-weight="600" letter-spacing="7">ATLAS</text>

  <!-- subtle proof-pink accent line -->
  <line x1="104" y1="62" x2="252" y2="62" stroke="#F478C6" stroke-width="0.6" opacity="0.45"/>
</svg>
