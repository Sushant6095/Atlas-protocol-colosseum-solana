<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none" role="img" aria-label="Atlas — Titan bearing the celestial sphere">
  <title>Atlas</title>
  <desc>The Titan Atlas in a kneeling stance, both arms raised, bearing the celestial sphere overhead. The sphere shows meridian and equator lines with a single bright proof point at the apex.</desc>

  <defs>
    <linearGradient id="figureGrad" x1="32" y1="28" x2="32" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A682FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#3F8CFF"/>
    </linearGradient>
    <linearGradient id="sphereGrad" x1="20" y1="6" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A682FF"/>
      <stop offset="1" stop-color="#3F8CFF"/>
    </linearGradient>
    <radialGradient id="sphereCore" cx="32" cy="17" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F8CFF" stop-opacity="0.10"/>
      <stop offset="0.7" stop-color="#A682FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#A682FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="northStar" cx="32" cy="6" r="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#3F8CFF"/>
      <stop offset="1" stop-color="#3F8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ CELESTIAL SPHERE ============ -->
  <!-- soft halo behind sphere -->
  <circle cx="32" cy="17" r="11" fill="url(#sphereCore)"/>

  <!-- main sphere outline -->
  <circle cx="32" cy="17" r="10" stroke="url(#sphereGrad)" stroke-width="1.6" fill="none"/>

  <!-- equator (horizontal ellipse) -->
  <ellipse cx="32" cy="17" rx="10" ry="3" stroke="url(#sphereGrad)" stroke-width="1.0" fill="none" opacity="0.85"/>

  <!-- meridian (vertical ellipse) -->
  <ellipse cx="32" cy="17" rx="3" ry="10" stroke="url(#sphereGrad)" stroke-width="1.0" fill="none" opacity="0.85"/>

  <!-- ecliptic (tilted) -->
  <ellipse cx="32" cy="17" rx="10" ry="4.5" transform="rotate(28 32 17)" stroke="url(#sphereGrad)" stroke-width="0.8" fill="none" opacity="0.55"/>

  <!-- north-star halo + bright point at apex of sphere -->
  <circle cx="32" cy="6.5" r="3" fill="url(#northStar)" opacity="0.9"/>
  <circle cx="32" cy="6.5" r="1.4" fill="#FFFFFF"/>

  <!-- ============ THE TITAN ============ -->
  <!-- All limbs: rounded thick strokes for a heraldic / pictogram feel.
       Pose: kneeling, both arms raised symmetrically, head bowed under load.
       The figure forms a stable triangular base (load-bearing). -->

  <g stroke="url(#figureGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- LEFT ARM: hand on sphere base → elbow out → shoulder -->
    <path d="M 24.5 28 Q 21 32 22.5 36 Q 24.5 40 27 41" />

    <!-- RIGHT ARM: hand on sphere base → elbow out → shoulder -->
    <path d="M 39.5 28 Q 43 32 41.5 36 Q 39.5 40 37 41" />

    <!-- TORSO: shoulders to hips -->
    <path d="M 27 41 L 28 53" />
    <path d="M 37 41 L 36 53" />

    <!-- BELT / HIP LINE -->
    <path d="M 27 53 L 37 53" stroke-width="2.6"/>

    <!-- LEFT LEG: hip → knee (bent outward) → foot -->
    <path d="M 28 53 Q 22 60 18 64 Q 14 68 12 72" />

    <!-- RIGHT LEG: hip → knee (bent outward) → foot -->
    <path d="M 36 53 Q 42 60 46 64 Q 50 68 52 72" />

  </g>

  <!-- HEAD (bowed slightly forward, between arms, just below sphere) -->
  <circle cx="32" cy="33" r="3.4" fill="url(#figureGrad)"/>
  <!-- subtle highlight on head -->
  <circle cx="31" cy="32" r="0.9" fill="#FFFFFF" opacity="0.35"/>

  <!-- HANDS gripping the sphere (small accents at sphere base) -->
  <circle cx="24.5" cy="28" r="1.6" fill="url(#figureGrad)"/>
  <circle cx="39.5" cy="28" r="1.6" fill="url(#figureGrad)"/>

  <!-- FEET (small accents at the base of legs) -->
  <circle cx="12" cy="72" r="1.6" fill="url(#figureGrad)"/>
  <circle cx="52" cy="72" r="1.6" fill="url(#figureGrad)"/>

  <!-- ============ FOUNDATION (subtle) ============ -->
  <!-- thin horizon line — the ground Atlas kneels on -->
  <line x1="6" y1="76" x2="58" y2="76" stroke="#3F8CFF" stroke-width="0.5" stroke-dasharray="0.8 1.6" opacity="0.4"/>
</svg>
